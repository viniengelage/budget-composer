name: Build desktop

# O Hutch empacota para o sistema onde ele roda — não existe cross-compile.
# Cada instalador sai do seu runner nativo.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Tipos, lint e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar Hutch
        run: |
          curl -fsSL https://hutch.blackboard.sh/hutch/install.sh | sh
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"

      - run: bun install --frozen-lockfile

      # O tsconfig aponta para .hutch/devkit; sem preparar, o typecheck não
      # encontra os tipos do SDK do Electrobun.
      - run: hutch electrobun prepare

      - run: bun run typecheck
      - run: bun run lint
      - run: bun test

  macos:
    name: Instalador macOS
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar Hutch
        run: |
          curl -fsSL https://hutch.blackboard.sh/hutch/install.sh | sh
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"

      - run: bun install --frozen-lockfile
      - run: bun run build

      - uses: actions/upload-artifact@v4
        with:
          name: orcamentos-grameira-macos
          path: artifacts/macos-arm64-*
          if-no-files-found: error

  windows:
    name: Instalador Windows (.exe)
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar Hutch
        shell: pwsh
        run: |
          & ([scriptblock]::Create((irm https://hutch.blackboard.sh/hutch/install.ps1)))
          "$env:USERPROFILE\.hutch\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - run: bun install --frozen-lockfile
      - run: bun run build

      # win-x64-OrcamentosGrameira-Setup.zip traz o instalador .exe visível e o
      # payload oculto ao lado; os dois precisam viajar juntos.
      - uses: actions/upload-artifact@v4
        with:
          name: orcamentos-grameira-windows
          path: artifacts/win-x64-*
          if-no-files-found: error
