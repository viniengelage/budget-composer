name: Build desktop

# O Hutch empacota para o sistema onde ele roda — não existe cross-compile.
# Cada instalador sai do seu runner nativo.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Tipos, lint e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar Hutch
        run: |
          curl -fsSL https://hutch.blackboard.sh/hutch/install.sh | sh
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"

      - run: bun install --frozen-lockfile

      # O tsconfig aponta para .hutch/devkit; sem preparar, o typecheck não
      # encontra os tipos do SDK do Electrobun.
      - run: hutch electrobun prepare

      - run: bun run typecheck
      - run: bun run lint
      - run: bun test

  build:
    name: Instalador ${{ matrix.label }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: macos-arm64
            label: macOS
          - runner: windows-latest
            target: win-x64
            label: Windows (.exe)
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar Hutch (macOS)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://hutch.blackboard.sh/hutch/install.sh | sh
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"

      - name: Instalar Hutch (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ([scriptblock]::Create((irm https://hutch.blackboard.sh/hutch/install.ps1)))
          "$env:USERPROFILE\.hutch\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - run: bun install --frozen-lockfile

      # A versão vira 1.0.<número da execução> para que o número que aparece no
      # programa, o nome da Release e a tag do git sejam sempre o mesmo. Sem
      # isso, toda build se chamaria 1.0.0 e a pessoa não teria como saber qual
      # versão está rodando.
      - name: Carimbar a versão
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bun run scripts/set-version.ts 1.0.${{ github.run_number }}

      - run: bun run build

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publicar release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Juntar os artefatos dos dois alvos
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      # Uma Release nova por push. É dela que o app instalado busca atualização,
      # através de `release.baseUrl` (.../releases/latest/download).
      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Versão 1.0.${{ github.run_number }}
          files: release-artifacts/*
          generate_release_notes: true
          make_latest: true
